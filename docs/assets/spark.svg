<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-label="Spark ARM64: Jupyter ejecuta el driver, el master asigna recursos y uno o dos workers ejecutan las tareas."><title>Spark ARM64: Jupyter ejecuta el driver, el master asigna recursos y uno o dos workers ejecutan las tareas.</title><defs><marker id="spark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708c93"/></marker></defs><g font-family="system-ui,sans-serif" fill="#19343d"><rect x="10" y="10" width="1020" height="420" rx="15" fill="#f9fbfa" stroke="#b8cbc8" stroke-dasharray="6 5"/><text x="30" y="38" font-size="12" font-weight="700">DOCKER DESKTOP · MÁQUINA VIRTUAL LINUX ARM64 EN TU MAC</text><g><rect x="45" y="80" width="270" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="63" y="111" font-size="18" font-weight="700">JupyterLab · driver</text><text x="63" y="134" font-size="13" fill="#4c6268">Tu cuaderno crea la aplicación</text><text x="63" y="152" font-size="13" fill="#4c6268">localhost:8888 · límite 2 GiB</text></g><g><rect x="415" y="80" width="260" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="433" y="111" font-size="18" font-weight="700">Spark master</text><text x="433" y="134" font-size="13" fill="#4c6268">Asigna recursos a la aplicación</text><text x="433" y="152" font-size="13" fill="#4c6268">localhost:8080 · límite 512 MiB</text></g><path d="M 315 123 L 413 123" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#spark-arrow)"/><text x="365" y="106" text-anchor="middle" font-size="12" fill="#52666d">solicita recursos</text><g><rect x="260" y="235" width="300" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="278" y="266" font-size="18" font-weight="700">Worker 1 → executor</text><text x="278" y="289" font-size="13" fill="#4c6268">2 núcleos · 1 GiB para Spark</text><text x="278" y="307" font-size="13" fill="#4c6268">Contenedor: límite 2 GiB</text></g><g data-optional="true"><rect x="655" y="235" width="300" height="86" rx="11" fill="#e8f0f5" stroke="#c0d0d1"/><text x="673" y="266" font-size="18" font-weight="700">Worker 2 → executor</text><text x="673" y="289" font-size="13" fill="#4c6268">Solo en modo clase</text><text x="673" y="307" font-size="13" fill="#4c6268">2 núcleos · 1 GiB para Spark</text></g><path d="M 485 166 L 485 205 L 410 205 L 410 233" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#spark-arrow)"/><text x="440" y="194" text-anchor="middle" font-size="12" fill="#52666d">asignación</text><path d="M 605 166 L 605 205 L 805 205 L 805 233" fill="none" stroke="#708c93" stroke-width="2" marker-end="url(#spark-arrow)"/><text x="45" y="280" font-size="12" fill="#52666d">El driver coordina</text><text x="45" y="299" font-size="12" fill="#52666d">las tareas y resultados.</text><rect x="45" y="356" width="950" height="48" rx="8" fill="#f6eddb"/><text x="65" y="385" font-size="15">workspace/ en tu Mac ↔ /workspace en todos los contenedores · cuadernos, CSV y Parquet</text></g></svg>